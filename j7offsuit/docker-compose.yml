services:
  postgres:
    image: postgres:16-alpine
    container_name: j7offsuit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: j7offsuit
      POSTGRES_USER: j7
      POSTGRES_PASSWORD: j7pass
    ports:
      - "5432:5432"
    volumes:
      - j7offsuit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U j7 -d j7offsuit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: j7offsuit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/j7offsuit
      SPRING_DATASOURCE_USERNAME: j7
      SPRING_DATASOURCE_PASSWORD: j7pass
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"

volumes:
  j7offsuit_pg_data:
